name: Quellen prüfen und veröffentlichen

on:
  schedule:
    # GitHub plant in UTC und kennt keine Sommerzeit. Erster Lauf 04:07 UTC, letzter 20:57 UTC:
    # im Sommer 06:07 bis 22:57, im Winter 05:07 bis 21:57 Berliner Zeit, 102 Läufe am Tag.
    # Die Einstellungsseite nennt genau diese Zeiten.
    # GitHub führt geplante Läufe nicht zuverlässig aus: Mit "*/30" liefen am 15.09. 5 von 34, am 16.09. bis 11 Uhr
    # einer; Antworten, die um 07:51 im DIP standen, kamen erst um 11:08 in die App. Zur vollen und halben Stunde ist
    # die Last am höchsten, GitHub empfiehlt andere Minuten. Ein Lauf dauert etwa eine Minute, mehr Termine kosten
    # also kaum etwas und fangen ausgefallene auf.
    - cron: '7,17,27,37,47,57 4-20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Die Datenbank ist ableitbarer Zwischenstand und wird nicht versioniert, sonst wuchse das
      # Repository bei stündlichen Läufen um Hunderte MB im Jahr. Fehlt der Zwischenspeicher,
      # baut der Lauf sie aus public/bootstrap.json wieder auf.
      - uses: actions/cache@v4
        with:
          path: data
          key: monitor-db-${{ github.run_id }}
          restore-keys: monitor-db-

      - name: Quellen abrufen
        id: run
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
          DATABASE_URL: file:data/monitor.db
        run: npm run monitor

      # Laeuft ein Zeitplan an, waehrend ein Push-Lauf schon gepusht hat, ist der Checkout veraltet
      # und der Push wird abgelehnt. Deshalb den eigenen Stand auf den aktuellen Remote setzen statt
      # zu rebasen: die Datei aus diesem Lauf ist die frischere, alles andere kommt vom Remote.
      - name: Neuen Stand sichern
        if: steps.run.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/bootstrap.json "$RUNNER_TEMP/bootstrap.json"
          for versuch in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/bootstrap.json" public/bootstrap.json
            git add public/bootstrap.json
            if git diff --staged --quiet; then echo "Kein inhaltlicher Unterschied"; break; fi
            git commit --quiet -m "Quellenstand $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push --quiet; then echo "Gesichert im Versuch $versuch"; break; fi
            echo "Push abgelehnt, Remote hat sich bewegt - Versuch $versuch"
            sleep $((versuch * 5))
          done

      # Next.js benennt Bündel nach ihrem Inhalt. Aendert sich der Code, heissen sie anders und die
      # alten verschwinden beim Deploy. GitHub Pages laesst die index.html aber zehn Minuten
      # zwischenspeichern: wer sie in dieser Zeit noch aus dem Zwischenspeicher hat, sucht Bündel,
      # die es nicht mehr gibt - die Seite erscheint dann ohne Gestaltung. Deshalb wird der
      # vorherige Stand der Bündel mitgeliefert; er deckt das Zeitfenster vollstaendig ab.
      - name: Bündel des vorherigen Laufs holen
        uses: actions/cache@v4
        with:
          path: .static-vorher
          key: static-${{ github.run_id }}
          restore-keys: static-

      # Laeufe fuer aeltere Commits koennen nach neueren starten. Am 13.09. begann der Lauf fuer 4d13daa (angelegt 09:49)
      # erst nach dem fuer 96312ef und lieferte um 09:53 dessen aeltere Oberflaeche wieder aus - beide "erfolgreich".
      # Gebaut wird deshalb immer der neueste Code; die Daten kommen aus diesem Lauf, der sie gerade abgerufen hat.
      - name: Neuesten Code holen
        run: |
          cp public/bootstrap.json "$RUNNER_TEMP/bootstrap-bau.json"
          pakete=$(git hash-object package-lock.json)
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          cp "$RUNNER_TEMP/bootstrap-bau.json" public/bootstrap.json
          if [ "$(git hash-object package-lock.json)" != "$pakete" ]; then npm ci; fi
          echo "Ausgeloest von ${GITHUB_SHA::7}, gebaut wird $(git rev-parse --short HEAD)"

      - name: Seite bauen
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name != format('{0}.github.io', github.repository_owner) && format('/{0}', github.event.repository.name) || '' }}
          NEXT_PUBLIC_REPO: ${{ github.repository }}
        # Die Fassung ist ein Fingerabdruck des Codes, nicht des Datenstands: bootstrap.json zaehlt nicht, sonst luede die
        # App nach jedem Datenlauf neu. Aus den Inhalten der Dateien statt aus der Historie - der Checkout ist flach.
        # Die Seite vergleicht sie mit version.json und laedt nach; sonst laeuft eine App auf dem Home-Bildschirm stundenlang alt.
        run: |
          export NEXT_PUBLIC_BUILD=$(git ls-files -s -- . ':(exclude)public/bootstrap.json' | git hash-object --stdin | cut -c1-12)
          npm run build:pages
          printf '{"build":"%s"}' "$NEXT_PUBLIC_BUILD" > out/version.json
          echo "Fassung $NEXT_PUBLIC_BUILD"

      - name: Vorherige Bündel mitliefern
        run: |
          mkdir -p .static-vorher out/_next/static
          # Erst die Buendel DIESES Builds sichern - danach ist out/ eine Mischung aus beiden Staenden.
          rm -rf .static-neu && cp -R out/_next/static .static-neu
          # Nur ergaenzen, nie ueberschreiben: die Dateien dieses Builds haben Vorrang.
          cp -Rn .static-vorher/. out/_next/static/ 2>/dev/null || true
          echo "Dieser Build: $(find .static-neu -type f | wc -l | tr -d ' ') Dateien"
          echo "Ausgeliefert: $(find out/_next/static -type f | wc -l | tr -d ' ') Dateien (mit dem vorherigen Stand)"
          # Fuer den naechsten Lauf nur diesen Build vormerken, damit sich nichts anhaeuft.
          rm -rf .static-vorher && mv .static-neu .static-vorher

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4

name: Quellen prüfen und veröffentlichen

on:
  schedule:
    # GitHub plant in UTC. 04:00 und 05:00 UTC decken 06:00 Berliner Zeit in Sommer- und Winterzeit ab;
    # der Lauf selbst prüft die Berliner Stunde und läuft höchstens einmal je Kalendertag.
    - cron: '0 4,5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Quellen abrufen
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
          DATABASE_URL: file:data/monitor.db
        # Bei push und manuellem Start ohne Zeitfenster-Sperre, damit der erste Stand sofort entsteht.
        run: npm run ${{ github.event_name == 'schedule' && 'monitor:cron' || 'monitor' }}

      - name: Neuen Stand sichern
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.db public/bootstrap.json
          git diff --staged --quiet || git commit -m "Quellenstand $(date -u +%Y-%m-%d)"
          git push

      - name: Seite bauen
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name != format('{0}.github.io', github.repository_owner) && format('/{0}', github.event.repository.name) || '' }}
        run: npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4

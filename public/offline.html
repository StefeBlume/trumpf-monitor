<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Policy Monitor · Offline</title><style>body{font-family:-apple-system,sans-serif;background:#f4f6f9;color:#18213b;margin:0;padding:calc(env(safe-area-inset-top) + 30px) 22px 40px}h1{font-size:30px;letter-spacing:-1px}p{line-height:1.6;color:#657089}a.button{display:block;background:#173fe2;color:white;text-align:center;padding:15px;border-radius:9px;text-decoration:none;margin:25px 0}article{background:white;border:1px solid #e3e7ef;padding:18px;border-radius:10px;margin:12px 0}article h2{font-size:17px;line-height:1.45}article p{font-size:14px}small{color:#657089}.tag{font-size:12px;color:#315694}header{font-weight:650;color:#173fe2;letter-spacing:1px;margin-bottom:35px}</style><header>TRUMPF · POLICY MONITOR</header><h1>Gerade keine Verbindung.</h1><p>Deine Internetverbindung oder der Online-Dienst ist vorübergehend nicht erreichbar. Ein MacBook wird nicht benötigt.</p><a class="button" href="https://policy-monitor-stefeblume.stefeblume42.chatgpt.site/">Erneut verbinden</a><h2>Gespeicherter Stand</h2><p id="status">Offline-Stand wird geladen …</p><main id="items"></main><script>
(async()=>{try{const result=await window.Capacitor.Plugins.OfflineCache.load();let d=result.payload?JSON.parse(result.payload):null;if(!d){const r=await fetch('bootstrap.json');if(r.ok)d=await r.json();}if(!d)throw Error();document.querySelector('#status').textContent='Stand: '+new Date(d.serverTime).toLocaleString('de-DE')+'. Keine aktuelle Quellenprüfung möglich.';const items=document.querySelector('#items');for(const item of (d.items||[]).filter(x=>!x.archived).sort((a,b)=>b.evaluation.score-a.evaluation.score)){const card=document.createElement('article');const tag=document.createElement('small');tag.textContent=item.institution+' · gespeicherter Befund';const title=document.createElement('h2');title.textContent=item.title;const reason=document.createElement('p');reason.textContent=item.evaluation.reason;card.append(tag,title,reason);items.append(card);}}catch{document.querySelector('#status').textContent='Noch kein Offline-Stand verfügbar. Bitte einmal online verbinden.';}})();
</script></html>
